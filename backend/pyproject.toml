[project]
name = "timetracker-backend"
version = "0.1.0"
description = "Time tracker backend (Django + DRF)"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.1",
    "django-environ>=0.11",
    "gunicorn>=21.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timetracker
      POSTGRES_PASSWORD: timetracker
      POSTGRES_DB: timetracker
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U timetracker']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      SECRET_KEY: dev-insecure-change-me
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://timetracker:timetracker@db:5432/timetracker
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TIME_ZONE: Europe/Moscow
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      # Browser (on the host) reaches the backend via its published port.
      VITE_API_BASE: http://localhost:8000/api
      # File watching over a Windows/Mac bind mount needs polling, otherwise
      # Vite never sees source edits and serves stale modules.
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '300'
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
